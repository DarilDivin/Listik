[package]
name = "app"
version = "0.2.3"
description = "Listik, an offline-first personal task manager and journal."
authors = ["Daril D."]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.7.0", features = [ "protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Rouvrir une piece jointe dans la visionneuse du systeme : un document
# attache qu'on ne peut pas relire ne sert a rien.
tauri-plugin-opener = "2"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
tauri-plugin-process = "2"

# Accès données côté Rust (remplace tauri-plugin-sql exposé au webview)
# Empreintes des migrations (voir db::repair_line_ending_checksums) ; même version que sqlx.
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# Génération des types TypeScript depuis les structures Rust (source de vérité)
ts-rs = "10"

# Client HTTP pour l'IA : Groq direct (ai_parse) et serveur MCP local (ai_agent_claude)
reqwest = { version = "0.12", features = ["json"] }

# Serveur MCP in-process (exposé en HTTP loopback) pour l'agent CLI (Phase R)
axum = "0.8"
tauri-plugin-updater = "2"

# Decoder le chemin d un export de passage, passe en en-tete (voir passage.rs).
# Deja tire par Tauri : aucune dependance nouvelle a telecharger.
percent-encoding = "2"

# Un passage du journal en document Word (voir word.rs). `docx-rs` sans son
# decodeur d images : il panique sur un format qu il ne lit pas. On decode donc
# nous-memes, avec `image`, qui rend une erreur au lieu de faire tomber l app.
docx-rs = { version = "0.4.22", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Repondre a `PermissionRequested` de WebView2 : sans ca `getUserMedia` reste
# suspendu pour toujours. Versions alignees sur celles que tire deja Tauri.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_System_Com",
    # La toile traversante de la barre rapide (voir cadre/windows.rs).
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

# La barre rapide en vrai panneau macOS (voir cadre/macos.rs). Versions
# alignées sur celles que tire déjà tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSWindow",
] }

[dev-dependencies]
# Relire un .docx produit par word.rs ; meme version que celle de docx-rs.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Mock IPC (tauri::test) pour vérifier la frontière invoke() -> #[tauri::command]
# sans dépendre d'une vraie fenêtre native.
tauri = { version = "2.7.0", features = ["tray-icon", "test"] }
