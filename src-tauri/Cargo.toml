[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.7.0", features = [ "protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Rouvrir une piece jointe dans la visionneuse du systeme : un document
# attache qu'on ne peut pas relire ne sert a rien.
tauri-plugin-opener = "2"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
tauri-plugin-process = "2"

# Accès données côté Rust (remplace tauri-plugin-sql exposé au webview)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }

# Génération des types TypeScript depuis les structures Rust (source de vérité)
ts-rs = "10"

# Client HTTP pour l'IA : Groq direct (ai_parse) et serveur MCP local (ai_agent_claude)
reqwest = { version = "0.12", features = ["json"] }

# Serveur MCP in-process (exposé en HTTP loopback) pour l'agent CLI (Phase R)
axum = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Repondre a `PermissionRequested` de WebView2 : sans ca `getUserMedia` reste
# suspendu pour toujours. Versions alignees sur celles que tire deja Tauri.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

[dev-dependencies]
# Mock IPC (tauri::test) pour vérifier la frontière invoke() -> #[tauri::command]
# sans dépendre d'une vraie fenêtre native.
tauri = { version = "2.7.0", features = ["tray-icon", "test"] }
