name: Publish download site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "NOUVEAUTES.md"
      - "scripts/nouveautes.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # La page Nouveautés n'est pas versionnée : elle se génère ici, depuis NOUVEAUTES.md.
      - run: node scripts/nouveautes.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
